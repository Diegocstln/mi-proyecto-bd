<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BooksNexus | Acceso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="shortcut icon" href="../assets/favicon.png" />
    <script src="../../config.js" defer></script>
    <script src="../../local-api.js" defer></script>
    <script src="login.js" defer></script>
  </head>

  <body>
    <main class="auth-page">
      <section class="auth-copy">
        <a class="back-link" href="../../index.html">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>Volver</span>
        </a>
        <img class="auth-logo" src="../assets/logo_white.png" alt="BooksNexus" width="150" />
        <p class="eyebrow">BooksNexus</p>
        <h1>Entra a tu biblioteca social</h1>
        <p>Inicia sesión con tu usuario o crea tu cuenta para guardar lecturas.</p>
      </section>

      <section class="auth-panel" aria-label="Formulario de acceso">
        <div class="tabs" role="tablist" aria-label="Tipo de acceso">
          <button class="active" type="button" data-auth-mode="login">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            <span>Entrar</span>
          </button>
          <button type="button" data-auth-mode="register">
            <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
            <span>Crear cuenta</span>
          </button>
        </div>

        <form id="auth-form">
          <label class="register-only" hidden>
            Nombre
            <input id="nombre" name="nombre" type="text" minlength="2" maxlength="100" placeholder="Mely Gonzalez" autocomplete="name" />
          </label>
          <label class="register-only" hidden>
            Usuario
            <input id="username" name="username" type="text" minlength="3" maxlength="40" pattern="[a-z0-9_]{3,40}" placeholder="mely_reader" autocomplete="username" />
          </label>
          <label class="register-only" hidden>
            Correo
            <input id="correo" name="correo" type="email" maxlength="120" placeholder="correo@escuela.edu" autocomplete="email" />
          </label>
          <label>
            <span id="identifier-label">Usuario o correo</span>
            <input id="usuario" name="usuario" type="text" maxlength="120" placeholder="mely_reader o correo@escuela.edu" autocomplete="username" required />
          </label>
          <label>
            Contraseña
            <input id="password" name="password" type="password" minlength="8" maxlength="128" placeholder="********" autocomplete="current-password" required />
          </label>
          <button class="primary-button" id="submit-button" type="submit">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            <span>Entrar</span>
          </button>
        </form>

        <p class="hint" id="auth-status" role="status">Listo para entrar a BooksNexus.</p>
      </section>
    </main>

    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
